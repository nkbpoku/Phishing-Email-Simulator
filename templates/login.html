<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Phishing Email Simulator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f6;
            color: #1e293b;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 420px;
            margin: 70px auto;
            padding: 32px;
            background: white;
            border-radius: 12px;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #16645b;
            color: white;
            border: none;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        .error {
            color: #b91c1c;
        }
    </style>
</head>

<body>
<main>
    <h1>Administrator login</h1>
    <p>Sign in to manage simulations and view results.</p>

    {% if error %}
        <p class="error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Username</label>
        <input
            id="username"
            name="username"
            autocomplete="username"
            maxlength="64"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
